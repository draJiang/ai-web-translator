<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>AI 网页阅读助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>AI 网页阅读助手</h1>
      <p class="subtitle">把网页正文原地改写为 B1 难度英文</p>
    </header>
    <main>
      <div id="warning" class="warning hidden"></div>
      <button id="processBtn" class="primary">转为 B1 英文</button>
      <p id="status" class="status"></p>
      <p class="tip">小技巧：按住 Alt 选中任意单词或句子，可单独生成解释</p>
    </main>
    <footer>
      <button id="openOptions" class="link">AI 服务商设置</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
