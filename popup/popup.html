<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Web Reader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>AI Web Reader</h1>
      <p class="subtitle">Rewrite webpage text in place with AI</p>
    </header>
    <main>
      <div id="warning" class="warning hidden"></div>
      <button id="processBtn" class="primary">Rewrite</button>
      <p id="status" class="status"></p>
      <p class="tip">Tip: hold Alt and select any word or sentence to get an explanation</p>
    </main>
    <footer>
      <button id="openOptions" class="link">AI Provider Settings</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
